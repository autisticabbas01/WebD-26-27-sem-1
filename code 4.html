<html>
<head>
    <title>Hotel Room Booking Form</title>
</head>
<body>

    <center>
        <h2>Hotel Room Booking Form</h2>

        <form action="#" method="post">
            <table cellpadding="5" cellspacing="5">
                
                <!-- Full Name -->
                <tr>
                    <td align="right"><label for="fullname">Full Name:</label></td>
                    <td><input type="text" id="fullname" name="fullname" required></td>
                </tr>

                <!-- Email -->
                <tr>
                    <td align="right"><label for="email">Email:</label></td>
                    <td><input type="email" id="email" name="email" required></td>
                </tr>

                <!-
                <tr>
                    <td align="right"><label for="phone">Phone:</label></td>
                    <td><input type="tel" id="phone" name="phone" required></td>
                </tr>

                <!-- Check-in Date -->
                <tr>
                    <td align="right"><label for="checkin">Check-in Date:</label></td>
                    <td><input type="date" id="checkin" name="checkin" required></td>
                </tr>

                <!-- Check-out Date -->
                <tr>
                    <td align="right"><label for="checkout">Check-out Date:</label></td>
                    <td><input type="date" id="checkout" name="checkout" required></td>
                </tr>

                <!-- Room Type Dropdown -->
                <tr>
                    <td align="right"><label for="roomtype">Room Type:</label></td>
                    <td>
                        <select id="roomtype" name="roomtype">
                            <option value="single">Single Room</option>
                            <option value="double">Double Room</option>
                            <option value="deluxe">Deluxe Room</option>
                            <option value="suite">Suite</option>
                        </select>
                    </td>
                </tr>

                <!-- Number of Guests -->
                <tr>
                    <td align="right"><label for="guests">Number of Guests:</label></td>
                    <td><input type="number" id="guests" name="guests" min="1" max="10"></td>
                </tr>

                <!-- Special Requests -->
                <tr>
                    <td colspan="2" align="center">
                        <label for="requests">Special Requests:</label><br>
                        <textarea id="requests" name="requests" rows="4" cols="45"></textarea>
                    </td>
                </tr>

                <!-- Action Buttons -->
                <tr>
                    <td colspan="2" align="center">
                        <input type="submit" value="Book Now">
                        <input type="reset" value="Reset Form">
                    </td>
                </tr>

            </table>
        </form>
    </center>

</body>
</html>
